  # ── UNKNOWN — ambiguous, low-volume, flagged rather than forced ────────────
  - reason: upi_autopay_not_supported_on_psp
    class: UNKNOWN
    source: razorpay/docs/errors/payment-reasons
    note: >
      ambiguous, low-volume, flagged not forced — practically permanent for
      this PSP/method combo (closer to CREDENTIAL_DEAD in effect), but it is
      a capability mismatch, not a dead card, and doesn't fit SPEC §4.1's
      card-specific CREDENTIAL_DEAD examples cleanly. See NOTES.md's Phase 3 entry.
  - reason: psp_app_not_supported
    class: UNKNOWN
    source: razorpay/docs/errors/payment-reasons
    note: >
      ambiguous, low-volume, flagged not forced — "blacklisted app" reads as
      permanent for that PSP, but the next-step text ("choose a different PSP
      app") reads like a retry instruction. Conservative default: UNKNOWN
      rather than guess between CHANNEL_DOWNTIME and CREDENTIAL_DEAD.

  # ── Description-only fallback (reason/source/step null) ─────────────────────
  - description_contains: "Mandate debit not as per frequency"
    class: UNKNOWN
    source: "fixture:020,028"
    note: >
      Dashboard forced-charge test-tool artifact, not a real customer
      decline — it fires when a charge is attempted before the invoice's
      natural due date. Confirmed non-generalizable, NOTES.md day-1 close.
      Kept here so the normaliser classifies it deliberately instead of
      falling through by accident, and so the coverage report can name it
      honestly rather than count it as a real classified reason.

  # ── code-only fallback — SPEC §4.1 lists these two codes directly under
  #    CHANNEL_DOWNTIME regardless of reason. BAD_REQUEST_ERROR is
  #    deliberately absent: it carries no signal alone (see header). ─────────
  - code: GATEWAY_ERROR
    class: CHANNEL_DOWNTIME
    source: razorpay/docs/errors/payment-reasons
    note: "SPEC §4.1 lists GATEWAY_ERROR as a CHANNEL_DOWNTIME example directly"
  - code: SERVER_ERROR
    class: CHANNEL_DOWNTIME
    source: razorpay/docs/errors/payment-reasons
    note: Razorpay's own server-side technical error
