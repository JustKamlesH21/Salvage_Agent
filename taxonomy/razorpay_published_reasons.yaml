# The `error.reason` enum as published by Razorpay, fetched live on
# 2026-09-02 (not from training data — SPEC §13 warns this list goes stale
# if hardcoded) from:
#   - razorpay/docs/payments/payment-gateway/rainy-day/errors/error-reasons
#     (the full reason enum with descriptions + next-steps — primary source)
#   - razorpay/docs/errors/payments/list
#     (the same values grouped by source: customer/business/gateway/razorpay;
#     contributes one reason — mcc_amount_limit_exceeded — not on the first page)
#
# Committed independently of taxonomy/failure_classes.yaml so
# tests/normalise/test_taxonomy.py::test_every_published_reason_has_a_rule
# is a genuine check against the published list (FR-04's acceptance:
# "every reason in Razorpay's published list maps to a FailureClass or
# explicitly to UNKNOWN"), not a tautology that only ever compares the
# taxonomy file to itself. Found underspecified — no such fixture existed —
# by spec-guardian's Phase 3 review; see NOTES.md's Phase 3 entry.
#
# card_disabled_for_online_payments (used in taxonomy/failure_classes.yaml,
# sourced from the cards-specific error page's plain-English description
# rather than confirmed as a literal enum value) is deliberately NOT listed
# here — it isn't confirmed as a real `error.reason` string, so it isn't
# claimed as "published" for this coverage check. The taxonomy rule that
# keys on it is harmless if it never matches a real payload.

