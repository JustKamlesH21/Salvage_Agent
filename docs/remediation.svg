<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 220" role="img" aria-label="A proposed scheduled retry is refused by gates G2 and G3. Salvage substitutes a pre-debit notice and re-gates it through all eleven gates, which allow it. Twenty-two verdicts on one decision.">
  <rect x="0" y="0" width="100%" height="100%" fill="#fbfaf7"/>
        <rect x="40" y="40" width="380" height="132" fill="#ffffff" stroke="#d6d2c8"/>
        <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
          <text x="60" y="68" fill="#6b7a88">WHAT IT WANTED TO DO</text>
          <text x="60" y="96" fill="#12263a" font-size="15">RETRY_SCHEDULED</text>
          <text x="60" y="124" fill="#6b7a88">11 gates evaluated</text>
          <text x="60" y="150" fill="#b3261e">⊘ refused by G2 and G3</text>
        </g>

        <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
          <line x1="440" y1="106" x2="620" y2="106" stroke="#12263a" stroke-width="1.5"/>
          <polygon points="620,106 610,101 610,111" fill="#12263a"/>
          <text x="452" y="96" fill="#b3261e">G2_PREDEBIT</text>
          <text x="452" y="128" fill="#6b7a88">supplies the remedy</text>
        </g>

        <rect x="640" y="40" width="380" height="132" fill="#ffffff" stroke="#d6d2c8"/>
        <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
          <text x="660" y="68" fill="#6b7a88">WHAT IT DID INSTEAD</text>
          <text x="660" y="96" fill="#12263a" font-size="15">SEND_PRE_DEBIT_NOTICE</text>
          <text x="660" y="124" fill="#6b7a88">11 gates evaluated again</text>
          <text x="660" y="150" fill="#1f6f4a">✓ allowed</text>
        </g>

        <text x="40" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#12263a">22 gate verdicts on one decision — eleven for the retry, eleven for the notice</text>
      </svg>
